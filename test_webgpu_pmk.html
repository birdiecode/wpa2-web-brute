<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebGPU WPA2 PMK</title>
  <style>
        body { font-family: monospace; max-width: 800px; margin: 40px auto; padding: 0 20px; background: #111; color: #ddd; }
        label { display: block; margin: 15px 0; }
        select { background: #222; color: #fff; padding: 8px; border: 1px solid #555; }
        input { background: #222; color: #fff; border: 1px solid #555; padding: 8px; }
        button { padding: 8px 16px; cursor: pointer; }
        .ok { color: #4cff4c; }
        .error { color: #ff5555; }
        pre { background: #1b1b1b; padding: 15px; white-space: pre-wrap; overflow-wrap: anywhere; }
        button:disabled { opacity: 0.5; cursor: wait; }
    </style>
</head>
<body>
  <h1>WPA2 PMK — WebGPU</h1>
  <p>Пароль — 8–63 байта UTF-8, SSID — от 1 до 32 байт UTF-8.</p>
  <form id="pmk-form">
    <label>Пароль: <input id="password" value="password" required></label>
    <label>SSID: <input id="ssid" value="IEEE" required></label>
    <label>Реализация: <select id="variant" disabled>
      <option value="split128">C: init → loop(128) → final, w[16]</option>
      <option value="mono80">A: Монолитный w[80]</option>
      <option value="mono16">B: Монолитный w[16]</option>
      <option value="scalar" selected>D: Монолитный scalar/unrolled (baseline)</option>
      <option value="ilp2">E: Scalar/unrolled, 2 кандидата на invocation</option>
    </select></label>
    <label>Workgroup для D: <select id="workgroup" disabled>
      <option value="1">1 (исходный baseline)</option>
      <option value="32">32</option><option value="64">64</option>
      <option value="128">128</option><option value="256">256</option>
      <option value="512">512</option>
    </select></label>
    <label>Повторов для сравнения: <select id="repeats" disabled>
      <option value="5">5</option><option value="10">10</option>
    </select></label>
    <button id="run" type="submit" disabled>Вычислить PMK</button>
    <button id="benchmark" type="button" disabled>Бенчмарк batch 1–4096</button>
    <button id="compare" type="button" disabled>Сравнить варианты: 512 / 1024 / 4096</button>
    <button id="compare-ad" type="button" disabled>Сравнить A / D: batch 4096</button>
    <button id="compare-de" type="button" disabled>Сравнить D / E: batch 4096</button>
    <button id="workgroups" type="button" disabled>Сравнить workgroup D: 5 замеров, batch 4096</button>
    <button id="stop" type="button" disabled>Остановить после расчёта</button>
  </form>
  <p>Выбор workgroup применяется к расчёту D и его бенчмарку 1–4096. Сравнения A–E сохраняют исходные размеры workgroup.</p>
  <p id="status" role="status" aria-live="polite">Инициализация WebGPU...</p>
  <pre id="out">Ожидание...</pre>
  <script type="text/javascript" src="wpa2_webgpu_pmk.js"></script>
</body>
</html>
